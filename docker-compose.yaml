version: "3.8"

x-common: &common-settings
  ipc: host
  ulimits:
    memlock:
      soft: -1
      hard: -1
    stack:
      soft: 67108864
      hard: 67108864
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: "all"
            capabilities: [gpu]
  environment:
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility

services:
  jupyter:
    <<: *common-settings
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
    device_requests:
      - driver: nvidia
        count: all
        capabilities: [gpu]
